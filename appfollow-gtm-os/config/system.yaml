# AppFollow AI-Native GTM Operating System — global configuration
# All agents read this file at the start of every run, BEFORE the domain
# config named in the trigger prompt (config/{domain}.yaml).

language: en                     # all Slack messages are written in English
timezone: Europe/Helsinki        # all schedules are expressed in Helsinki time

operator:                        # the human the system escalates to.
  # Fail-stop notices (CLAUDE.md → Fail-stop protocol) go DIRECTLY to the
  # operator — Slack DM — never to the domain team channel.
  name: Anatoly Sharifulin       # CEO
  slack_id: U09S7CJEL            # verified in appfollow-team Slack (leadership-os owners.yaml)
  email: anatoly@appfollow.io

slack:
  workspace: appfollow-team
  # Domain channels live in the domain configs (config/{domain}.yaml →
  # slack.channel). Agents never post to a hardcoded channel.
  # Posting identity: routines run with the CEO's Slack MCP connector, so
  # every agent message posts AS THE CEO — same mechanism as
  # appfollow-leadership-os (there is no bot identity to configure; the
  # connector's authenticated account IS the posting identity).

asana:
  workspace_gid: "956538781886553"
  # Domain projects and their reading rules live in the domain configs.
  # Shared convention (ported from leadership-os, CEO 2026-07-19): agents
  # read a quarterly-bets board the way the CEO reads it — filter the
  # Urgency/Importance custom field to (Important + Urgent,
  # Important + Not urgent), sort by due date, and ALWAYS fetch subtasks
  # (get_task with include_subtasks) — subtasks go overdue independently.

quarter_resolution:
  # The current quarter is COMPUTED FROM THE RUN DATE in `timezone`:
  # Q1 = Jan–Mar, Q2 = Apr–Jun, Q3 = Jul–Sep, Q4 = Oct–Dec. The agent then
  # looks for the Asana section named by the domain's
  # asana.quarter_section_pattern (e.g. "Q{N} bets" → "Q3 bets").
  # FAIL-STOP if not found (CEO 2026-08-11): halt the run, post NOTHING to
  # the team channel, notify the operator directly and ask for a manual
  # section or other instructions. Never fall back, never silently skip.
  scheme: calendar               # Q{N} = ceil(month / 3)

guru_knowledge:
  # No Guru cards are registered for GTM OS yet. Unlike leadership-os,
  # knowledge/ in THIS repo is repo-canonical: agents read it directly.
  # When GTM context moves to Guru, list the cards here and adopt the
  # leadership-os no-fallback rule.
  cards: []

domains:
  # Registry of domain configs. Adding Sales / Customer Success later =
  # adding a file here + prompts; the agents in .claude/agents/ do not
  # change (design principle — see README.md).
  marketing: config/marketing.yaml
  # sales: config/sales.yaml               # future
  # customer_success: config/cs.yaml       # future

alert_rules:
  weekend_runs: false
  # Quiet success (ported from leadership-os): an Actions Check with
  # nothing overdue, nothing due and nothing newly completed posts
  # NOTHING. Silence = all on track.
