# Marketing domain configuration — read by the generic agents in
# .claude/agents/ when a prompt names this domain. Everything
# marketing-specific lives HERE (and in knowledge/), not in the agents.

domain: marketing

slack:
  channel: "#marketing-team"
  # channel_id: ""               # TODO: fill in the C… id on first run
  #                              # (slack_search_channels "marketing-team")
  post_as: ceo                   # routines run with the CEO's Slack MCP
  #                              # connector → messages post as the CEO,
  #                              # same mechanism as leadership-os

asana:
  project_id: "1213895660468839"           # "Marketing" board (owner: Anatoly)
  project_url: "https://app.asana.com/1/956538781886553/project/1213895660468839/list/1213896991158257"
  quarter_section_pattern: "Q{N} bets"     # currently "Q3 bets", later "Q4 bets", …
  # The quarter N is COMPUTED FROM THE RUN DATE (config/system.yaml →
  # quarter_resolution). FAIL-STOP if no section matches the pattern:
  # halt, post NOTHING to #marketing-team, notify the operator directly
  # (see CLAUDE.md → Fail-stop protocol).
  filter:                                  # Urgency/Importance custom field
    - "Important + Urgent"
    - "Important + Not urgent"
  sort: due_date
  include_subtasks: true                   # get_task with include_subtasks —
  #                                        # subtasks go overdue independently

owners:
  # Marketing owner map — used to address tasks and hygiene gaps in the
  # Actions Check. PRIMARY addressees are Alina and Olivia; part-time
  # contributors are surfaced THROUGH their owner (see part_timers), never
  # addressed directly.
  alina:
    name: Alina
    role: Growth Marketing Manager
    areas: [SEO/GEO, landing pages, blog, channel optimization]
    note: owns the work of part-timers Anastasia and Leo — their items are
      addressed to Alina, not to them
  olivia:
    name: Olivia
    role: Marketing Manager
    areas: [events, webinars, app industry report preparation,
      monthly digest, email campaigns]
  nikolay:
    name: Nikolay
    role: Designer
  fabian:
    name: Fabian
    role: Marketing Advisor
    note: helps the CEO, liaises with the team

part_timers:
  # part-timer → addressed via this owner
  anastasia: { role: SEO/GEO manager, address_via: alina }
  leo:       { role: content writer,  address_via: alina }

fallback_owner: operator         # no resolvable owner → address the
#                                # operator (CEO), per system.yaml

slack_handles:
  # TODO: replace each with the real Slack handle/user ID (U…) so
  # <@U…> mentions work — placeholders below WILL NOT resolve. The CEO
  # fills these in on the first run.
  alina: "@alina"                # TODO: replace with real Slack handle/ID
  olivia: "@olivia"              # TODO: replace with real Slack handle/ID
  nikolay: "@nikolay"            # TODO: replace with real Slack handle/ID
  fabian: "@fabian"              # TODO: replace with real Slack handle/ID

